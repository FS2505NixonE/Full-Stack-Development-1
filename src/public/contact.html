<!DOCTYPE html>
<html>
    <title>contact-form</title>
<!-- CONTACT FORM-->
<form id="contact-form">
    <label><b>Contact Form</b></label><br>
    <p><ins>Full Name</ins></p>
    <input type="text" name="full_name" id="full_name"  required /><br>
    <p><ins>Email</ins></p>
    <input type="email" name="email" id="email"  required /><br>
    <p><ins>Company Name</ins></p>
    <input type="text" name="company_name" id="company_name"  /><br>
    <p><ins>Project Name</ins></p>
    <input type="text" name="project_name" id="project_name"  /><br>
    <p><ins>Project Description</ins></p>
    <input type="text" name="project_desc" id="project_desc"  /><br>
    <p><ins>Department</ins></p>
    <input type="text" name="department" id="department"  /><br>
    <p><ins>Phone</ins></p>
    <input type="tel" name="phone" id="phone"  /><br>
    <p><ins>Message:</ins></p>
    <textarea id="message" required></textarea><br>
    <p><ins>File</ins></p>
    <fieldset id="file" required></fieldset><br>
    <input type="submit" action="" method="POST"></input>
</form>
<!-- CONNECTION TO CONTACT.JS-->
<script src="/assets/js/contact.js"></script>
</html>
